<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lupinos">
<title>Liga Lupinos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 3 58 12v20c0 15-11 25-26 29C17 57 6 47 6 32V12z' fill='%230b5d2a' stroke='%23f2c230' stroke-width='4'/%3E%3Ctext x='32' y='42' font-size='24' text-anchor='middle' fill='%23f2c230' font-family='Arial' font-weight='bold'%3ELL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#0b1f14; --noche2:#132c1e;
  --cesped:#0b5d2a; --cesped2:#0f6b32; --cesped-claro:#1f8a47;
  --tiza:#fbfdf8; --linea:#dfe8e0; --gris:#6b7a70; --tinta:#0f1d14;
  --oro:#f2c230; --plata:#c9d1d6; --bronce:#d08a4c;
  --ok:#14874a; --ok-bg:#d6f5e1; --ko:#c0392b; --ko-bg:#fde3e0;
  --radio:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--tinta);
  background:#0d5229;
  background-image:
    radial-gradient(circle at 50% 0, rgba(255,255,255,.08), transparent 55%),
    repeating-linear-gradient(180deg,#0f5a2e 0 110px,#0c5028 110px 220px);
  background-attachment:fixed; min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.contenedor{max-width:980px;margin:0 auto;padding:0 16px}

/* ---------- Cabecera tipo marcador ---------- */
.cabecera{background:linear-gradient(180deg,var(--noche),var(--noche2));color:#fff;border-bottom:3px solid var(--oro);
  box-shadow:0 6px 20px rgba(0,0,0,.35);position:sticky;top:0;z-index:20}
.cabecera .contenedor{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.escudo{width:46px;height:52px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.titulo{font-family:'Bebas Neue',Impact,sans-serif;font-size:32px;letter-spacing:2px;line-height:.9;margin:0}
.titulo span{color:var(--oro)}
.subtitulo{font-size:12px;opacity:.75;letter-spacing:.5px;margin-top:2px}
.cabecera .espacio{flex:1}
.chip-sesion{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.directo{display:flex;align-items:stretch;height:28px;background:rgba(0,0,0,.32);border-top:1px solid rgba(242,194,48,.35);font-size:12.5px;overflow:hidden}
.directo[hidden]{display:none}
.directo-etq{flex:none;display:flex;align-items:center;gap:6px;padding:0 9px;background:#3b4a40;color:#fff;font-weight:800;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase}
.directo-etq.vivo{background:#c8102e}
.directo-etq.vivo:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:latido 1.2s ease-in-out infinite}
@keyframes latido{50%{opacity:.25}}
.directo-vent{flex:1;overflow:hidden;display:flex;align-items:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.directo-pista{display:inline-flex;white-space:nowrap;animation:desliza var(--dur,60s) linear infinite;will-change:transform}
.directo-vent:hover .directo-pista,.directo-vent:active .directo-pista{animation-play-state:paused}
@keyframes desliza{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.dx{display:inline-flex;align-items:center;gap:6px;padding:0 14px;color:#dfe9e2;border-right:1px solid rgba(255,255,255,.14)}
.dx .n{font-size:10px;font-weight:700;opacity:.55}
.dx .mar{font-family:'Bebas Neue',Impact,sans-serif;font-size:17px;letter-spacing:1px;color:#fff;line-height:1}
.dx.in .mar{color:var(--oro)}
.dx .min{font-size:10.5px;font-weight:800;color:#ff7a7a}
.dx.post .min{color:#9db5a5;font-weight:700}
.dx.pre .min{color:#9db5a5;font-weight:600}
.dx .dsig{font-size:10.5px;font-weight:800;background:rgba(242,194,48,.18);color:var(--oro);border-radius:4px;padding:1px 5px}
@media(prefers-reduced-motion:reduce){.directo-vent{overflow-x:auto}.directo-pista{animation:none}}
.noticias{display:flex;flex-direction:column;gap:10px}
.noticia{display:flex;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px;color:inherit;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.noticia:active{transform:scale(.99)}
.noticia img{width:96px;height:72px;object-fit:cover;border-radius:10px;flex:none;background:#e8efe9}
.noticia .tx{min-width:0;display:flex;flex-direction:column;gap:4px}
.noticia b{font-size:15px;line-height:1.25;color:var(--noche)}
.noticia p{margin:0;font-size:13px;line-height:1.35;color:#4c5b51;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.noticia small{font-size:11.5px;color:#6b7a70;font-weight:600}
.medios{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.medios button{border:1px solid var(--linea);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--noche)}
.medios button.activo{background:var(--oro);border-color:var(--oro)}
@media(min-width:620px){.noticia img{width:140px;height:96px}}
.menu-admin{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.menu-admin button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--tiza);border:0;border-radius:var(--radio);box-shadow:0 10px 30px rgba(0,0,0,.25);padding:14px;min-height:118px;cursor:pointer;color:var(--tinta);font:inherit}
.menu-admin button:hover,.menu-admin button:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.menu-admin .ico{font-size:28px;line-height:1}
.menu-admin b{font-size:16px;margin-top:4px}
.menu-admin small{font-size:12.5px;color:var(--gris);line-height:1.35}
.menu-admin .estado{margin-top:auto;font-size:12px;font-weight:700;color:var(--cesped)}
.titulo-admin{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;margin-top:18px}
.titulo-admin h2{margin:0;font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:30px;letter-spacing:1px}
.mi-rellenar{margin:2px 0 4px}
.mi-cierre{margin:0 0 12px;text-align:center}
.mi-acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 10px}
.mi-acciones .btn{padding:9px 6px;font-size:12.5px;line-height:1.2}
.mi-form{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:12px;margin-bottom:12px}
.mi-form .acciones{display:flex;gap:8px;justify-content:flex-end}
.mi-tabs{display:flex;gap:4px;background:#e3ebe5;border-radius:12px;padding:4px;margin:6px 0 12px}
.mi-tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:12.5px;color:var(--gris);cursor:pointer}
.mi-tabs button.activo{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mis-jornadas tbody tr{cursor:pointer}
.mis-jornadas td.mas{color:var(--cesped);font-weight:700}
.mis-jornadas td.menos{color:#b3261e;font-weight:700}
.mis-jornadas .pill{font-size:10px;padding:1px 6px;background:#e3ebe5;color:var(--gris)}
.curiosidades{display:grid;gap:8px}
.curio{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 12px}
.curio .ico{font-size:24px;line-height:1.2}
.curio small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--gris)}
.curio b{display:block;font-size:16px;color:var(--tinta)}
.curio p{margin:2px 0 0;font-size:12.5px;color:var(--gris)}
.premios{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.premio{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px 12px}
.premio .ico{font-size:22px;line-height:1}
.premio .tit{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--gris);margin-top:6px}
.premio b{display:block;font-size:15px;color:var(--tinta);margin-top:2px}
.premio small{display:block;font-size:12px;color:var(--gris);margin-top:2px}
.premio.oro{border-color:#f1d27a;background:#fffaf0}
.clasif tbody tr[data-ficha]{cursor:pointer}
.clasif tbody tr[data-ficha] .nom:after{content:"›";color:var(--gris);margin-left:6px;font-weight:400}
.ficha-cab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:-4px 0 12px;color:var(--gris);font-size:13px}
.ficha-cab b{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;color:var(--tinta);letter-spacing:1px;font-weight:400}
.datos-ficha{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.datos-ficha div{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:8px 10px}
.datos-ficha span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--gris)}
.datos-ficha b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;font-weight:400;color:var(--tinta);line-height:1.1}
.datos-ficha small{display:block;font-size:11.5px;color:var(--gris)}
.grafica-puesto{position:relative;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:8px 6px 4px}
.grafica-puesto svg{display:block;width:100%;height:auto;overflow:visible}
.grafica-puesto .tip{position:absolute;pointer-events:none;background:var(--noche);color:#fff;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;transform:translate(-50%,-130%);white-space:nowrap;display:none}
.reparto{display:flex;height:22px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 4px}
.reparto i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;color:#fff;min-width:0}
.ficha-sec{margin-top:14px}
.ficha-sec h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris)}
.instalar{display:flex;align-items:center;gap:10px;background:var(--noche);color:#fff;border:1px solid rgba(242,194,48,.5);border-radius:14px;padding:10px 12px;margin:12px 0;font-size:14px;font-weight:600}
.instalar span{flex:1}
.instalar .x{background:none;border:0;color:#9db5a5;font-size:20px;line-height:1;padding:0 4px}
.demo{background:var(--oro);color:var(--noche);text-align:center;font-size:12px;font-weight:700;padding:5px 10px}

/* ---------- Navegación inferior ---------- */
.aviso-version{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;max-width:560px;margin:0 auto;background:var(--noche);color:#fff;border:2px solid var(--oro);border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--noche);border-top:2px solid var(--oro);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;max-width:200px;background:none;border:0;color:#9db5a5;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.nav button svg{width:24px;height:24px}
.nav button.activo{color:var(--oro)}
.nav button.activo svg{transform:translateY(-1px)}

/* ---------- Tarjetas ---------- */
.card{background:var(--tiza);border-radius:var(--radio);box-shadow:0 10px 30px rgba(0,0,0,.25);padding:16px;margin:16px 0}
.card h2,.card h3{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;font-weight:400;margin:0 0 10px}
.card h2{font-size:28px}.card h3{font-size:22px}
.muted{color:var(--gris);font-size:13px}
.aviso{background:#fff7d6;border:1px solid #f2dc8a;color:#6b5300;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.error{background:var(--ko-bg);border:1px solid #f3b8b1;color:#8f2418;border-radius:12px;padding:10px 12px;font-size:13px}

/* ---------- Selector de jornadas ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);color:#fff;border-radius:12px;padding:6px 12px;font-family:'Bebas Neue',Impact,sans-serif;font-size:20px;letter-spacing:1px;position:relative}
.chip.activo{background:var(--oro);color:var(--noche);border-color:var(--oro)}
.chip.anulada{opacity:.55;text-decoration:line-through}
.pill.nojuega{background:#e0e4e1;color:#4d5a52}
.chip .punto{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#3ddc84;border:2px solid var(--cesped)}

/* ---------- Marcador de jornada ---------- */
.marcador{background:linear-gradient(135deg,var(--noche),#16382a);color:#fff;border-radius:var(--radio);padding:18px;margin:12px 0 0;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.marcador:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border:3px solid rgba(255,255,255,.07);border-radius:50%}
.marcador .fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.marcador .num{font-family:'Bebas Neue',Impact,sans-serif;font-size:56px;line-height:.85;color:var(--oro)}
.marcador .num small{display:block;font-size:16px;color:#fff;opacity:.7;letter-spacing:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;letter-spacing:.3px}
.pill.abierta{background:#3ddc84;color:#05351a}
.pill.cerrada{background:#f2c230;color:#3d2e00}
.pill.final{background:#e8eef0;color:#25343b}
.pill .led{width:8px;height:8px;border-radius:50%;background:currentColor;animation:latido 1.4s infinite}
@keyframes latido{50%{opacity:.25}}
.marcador .datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px;position:relative;z-index:1}
.dato{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px}
.dato b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:1px;font-weight:400}
.dato span{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.6px}
.progreso{height:6px;background:rgba(255,255,255,.15);border-radius:6px;margin-top:6px;overflow:hidden}
.progreso i{display:block;height:100%;background:var(--oro);border-radius:6px}

/* ---------- Botones ---------- */
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-oro{background:var(--oro);color:var(--noche);box-shadow:0 4px 0 #b88f13}
.btn-verde{background:var(--cesped);color:#fff;box-shadow:0 4px 0 #063a19}
.btn-claro{background:#e9f0ea;color:var(--tinta)}
.btn-rojo{background:var(--ko);color:#fff}
.btn-wa{background:#25D366;color:#053d1f;box-shadow:0 4px 0 #128C7E}
.btn-peq{padding:7px 12px;font-size:13px;border-radius:10px;box-shadow:none}
.btn-bloque{width:100%}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cta{margin:14px 0 0}

/* ---------- Tabla de pronósticos (boleto) ---------- */
.tabla-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
table.boleto{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.boleto th,.boleto td{text-align:center;padding:0;border-bottom:1px solid var(--linea);height:42px}
.boleto thead th{border-bottom:2px solid var(--cesped);vertical-align:bottom;height:auto;padding:4px 0 8px}
.boleto .c-partido{position:sticky;left:0;background:var(--tiza);z-index:2;text-align:left;min-width:142px;max-width:170px;padding-right:8px;box-shadow:6px 0 8px -8px rgba(0,0,0,.35)}
.boleto thead .c-partido{z-index:3;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--gris)}
.vertical{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;white-space:nowrap;max-height:110px;overflow:hidden;text-overflow:ellipsis;margin:0 auto}
.boleto .c-jug{min-width:40px}
.boleto .c-res{min-width:48px;background:#f1f6f1}
.boleto thead .c-res .vertical{color:var(--cesped)}
.partido{display:flex;align-items:center;gap:8px}
.partido .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--noche);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.partido.pleno .n{background:var(--oro);color:var(--noche)}
.partido .eq{line-height:1.15;font-size:12px;font-weight:600;overflow:hidden}
.partido .eq small{display:block;font-weight:500;color:var(--gris);font-size:10.5px}
.sg{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 4px;border-radius:8px;font-weight:800;font-size:13px;background:#eef2ee;color:#2b3a30}
.sg.ok{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.sg.ko{background:var(--ko-bg);color:var(--ko);opacity:.85}
.sg.res{background:var(--cesped);color:#fff}
.sg.vacio{background:transparent;color:#b7c2ba}
.sg.pleno{font-size:11px;min-width:34px}
.boleto tfoot td{border:0;height:48px;font-family:'Bebas Neue',Impact,sans-serif;font-size:24px}
.boleto tfoot .c-partido{font-family:Inter,sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--gris)}
.boleto tfoot .top{color:var(--ok)}
.boleto .c-cons{min-width:48px;background:#fff8dc}
.boleto thead .c-cons .vertical{color:#8a6a00}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--gris);margin-top:12px;align-items:center}
.leyenda .sg{min-width:22px;height:22px;font-size:11px}

.barra-res{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-2px 0 12px}
.barra-res .muted{flex:1;min-width:150px}
.enviados{display:flex;flex-wrap:wrap;gap:8px}
.enviado{border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;background:#eef2ee;color:var(--gris)}
.enviado.si{background:var(--ok-bg);color:var(--ok)}

/* ---------- Clasificación ---------- */
.chips.temporadas{padding-top:4px}
.chips.claros .chip{color:var(--cesped);border-color:var(--linea);background:#fff}
.chips.claros .chip.activo{background:var(--oro);border-color:var(--oro);color:var(--noche)}
.chips.temporadas .chip{font-size:18px}
.palmares td.copas{font-size:15px;letter-spacing:1px}
.campeones .item .info b{white-space:normal}
.nota-hist{background:#fff8e1;border:1px solid #f1d27a;color:#6b5300;border-radius:12px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.check-jug{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.check-jug label{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer}
.podio{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:18px 0 6px}

.clasif tr.colista td{background:var(--ko-bg);border-color:#f3b8b1;color:#8f2418}

<script>
/* ════════════════════════════════════════════════════════════════
   CONFIGURACIÓN
   Pega aquí la URL de tu aplicación web de Apps Script (termina en /exec).
   Si la dejas vacía, la web funciona en MODO DEMO con datos inventados.
   ════════════════════════════════════════════════════════════════ */
/* Versión de la web: se cambia en cada publicación para avisar a quien la tenga abierta */
const VERSION_WEB = '2026-11-18.10';

const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxPNhiGb1QmM8r4mE39duL-4vkygd9sFyTYEQYbkWsTMGD_r-_LLzyg0YTE3jLGbayqFA/exec'
};

const DEMO = !CONFIG.API_URL;
const S = { datos: null, vista: 'jornada', jSel: null, sesion: null, propios: {}, admin: null, adminDatos: null, adminTab: 'inicio', edJornada: null, resSel: null, pronSel: { j: null, jug: null }, hist: null, histSel: 'actual', histJ: {}, histJSel: null };
const $ = (sel, raiz = document) => raiz.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const almacen = {
  get(k, sesion) { try { const v = (sesion ? sessionStorage : localStorage).getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v, sesion) { try { (sesion ? sessionStorage : localStorage).setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k, sesion) { try { (sesion ? sessionStorage : localStorage).removeItem(k); } catch (e) {} }
};

/* ─────────────── API ─────────────── */
async function api(accion, params = {}) {
  if (DEMO) return demoApi(accion, JSON.parse(JSON.stringify(params)));
  let r;
  try {
    r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ accion }, params)) });
  } catch (e) { throw new Error('Sin conexión con el servidor. Inténtalo de nuevo.'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error desconocido');
  return j.data;
}

async function cargarDatos() {
  S.datos = await api('datos');
  if (!DEMO) almacen.set('lupinos_datos', S.datos);
  if (S.jSel == null || !S.datos.jornadas.find(j => j.numero === S.jSel)) S.jSel = jornadaActual();
  pintarCabecera();
}

/* ─────────────── Cálculos ─────────────── */
function jornadaActual() {
  const js = S.datos.jornadas;
  if (!js.length) return null;
  const abierta = js.find(j => !j.cerrada && !j.anulada);
  return (abierta || js[js.length - 1]).numero;
}
function getJ(n) { return S.datos.jornadas.find(j => j.numero === n); }
function puntos(j, id) {
  const p = j.pronosticos[id];
  if (!Array.isArray(p)) return null;
  let n = 0;
  j.resultados.forEach((r, i) => { if (r && p[i] === r) n++; });
  return n;
}
function plenoAcertado(j, id) { const p = j.pronosticos[id]; return Array.isArray(p) && !!j.resultados[14] && p[14] === j.resultados[14]; }
function nRes(j) { return j.resultados.filter(Boolean).length; }
function tienePronosticos(id) { return S.datos.jornadas.some(j => j.pronosticos[id] !== undefined); }
function jugadoresVisibles() {
  return S.datos.jugadores.filter(g => g.activo || tienePronosticos(g.id))
    .sort((a, b) => (a.columna || 99) - (b.columna || 99) || a.nombre.localeCompare(b.nombre));
}
function masVotado(j, i) {
  const cuenta = {};
  Object.values(j.pronosticos).forEach(p => { if (Array.isArray(p) && p[i]) cuenta[p[i]] = (cuenta[p[i]] || 0) + 1; });
  const max = Math.max(0, ...Object.values(cuenta));
  if (!max) return null;
  return { signos: Object.keys(cuenta).filter(k => cuenta[k] === max), votos: max };
}
function jornadasQueCuentan() { return S.datos.jornadas.filter(j => !j.anulada); }
/**
 * Orden de la clasificación y desempates:
 * 1) puntos · 2) plenos al 15 acertados · 3) entre los que siguen empatados (2, 3, 4…),
 * gana quien haya sacado más puntos que sus rivales empatados en más jornadas (suma de «duelos» ganados).
 * Si aun así siguen igualados, comparten puesto.
 */
function ordenarClasificacion(filas, nombre) {
  filas.sort((a, b) => b.total - a.total || b.plenos - a.plenos);
  for (let i = 0; i < filas.length;) {
    let k = i;
    while (k + 1 < filas.length && filas[k + 1].total === filas[i].total && filas[k + 1].plenos === filas[i].plenos) k++;
    const grupo = filas.slice(i, k + 1);
    grupo.forEach(f => {
      f.duelos = 0;
      if (grupo.length > 1) grupo.forEach(o => { if (o !== f) f.por.forEach((p, x) => { if ((p || 0) > (o.por[x] || 0)) f.duelos++; }); });
    });
    grupo.sort((a, b) => b.duelos - a.duelos || nombre(a).localeCompare(nombre(b)));
    filas.splice(i, grupo.length, ...grupo);
    i = k + 1;
  }
  filas.forEach((f, i) => {
    const p = filas[i - 1];
    f.pos = p && p.total === f.total && p.plenos === f.plenos && p.duelos === f.duelos ? p.pos : i + 1;
    f.desempate = !!((p && p.total === f.total) || (filas[i + 1] && filas[i + 1].total === f.total));
  });
  return filas;
}
function clasificacion() {
  const js = jornadasQueCuentan();
  const filas = jugadoresVisibles().map(g => {
    const por = js.map(j => puntos(j, g.id));
    return {
      g, por,
      total: por.reduce((a, b) => a + (b || 0), 0),
      plenos: js.filter(j => plenoAcertado(j, g.id)).length,
      jugadas: por.filter(x => x !== null).length
    };
  });
  ordenarClasificacion(filas, f => f.g.nombre);
  // Posición antes de la última jornada con resultados (para la flecha de tendencia)
  const conRes = js.map((j, k) => (nRes(j) ? k : -1)).filter(k => k >= 0);
  const ult = conRes[conRes.length - 1];
  if (ult !== undefined && conRes.length > 1) {
    const prev = filas.map(f => ({ id: f.g.id, nombre: f.g.nombre, total: f.total - (f.por[ult] || 0),
      plenos: f.plenos - (plenoAcertado(js[ult], f.g.id) ? 1 : 0), por: f.por.map((p, k) => (k === ult ? null : p)) }));
    ordenarClasificacion(prev, x => x.nombre);
    filas.forEach(f => { f.antes = prev.find(x => x.id === f.g.id).pos; f.ultima = f.por[ult]; });
  } else if (ult !== undefined) {
    filas.forEach(f => { f.ultima = f.por[ult]; });
  }
  return filas;
}

/* ─────────────── Formato ─────────────── */
function fmtFecha(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function cuentaAtras(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return 'Cerrada';
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d) return d + 'd ' + h + 'h';
  if (h) return h + 'h ' + mm + 'm';
  return mm + ' min';
}
function eqHtml(p, i) {
  const t = p.local || p.visitante ? esc(p.local) + ' – ' + esc(p.visitante) : 'Partido ' + (i + 1);
  return '<span class="eq">' + t + (p.fecha ? '<small>' + esc(p.fecha) + '</small>' : '') + '</span>';
}
function partidoHtml(p, i) { return '<div class="partido' + (i === 14 ? ' pleno' : '') + '"><span class="n">' + (i === 14 ? 'P15' : i + 1) + '</span>' + eqHtml(p, i) + '</div>'; }
function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso), z = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + 'T' + z(d.getHours()) + ':' + z(d.getMinutes());
}

async function conCarga(boton, fn) {
  const txt = boton ? boton.innerHTML : '';

}

/** Historial de jornadas del jugador: aciertos, puesto en la jornada, pleno y comparación con la media */
function misJornadasHtml(id, js, jugs) {
  const filas = js.slice().reverse().map(j => {
    const p = puntos(j, id);
    if (p === null) return '<tr data-ir-j="' + j.numero + '"><td>J' + j.numero + '</td><td colspan="4" class="muted">No jugó</td></tr>';
    const ps = jugs.map(o => puntos(j, o.id)).filter(v => v !== null);
    const puesto = 1 + ps.filter(v => v > p).length;
    const media = ps.reduce((a, b) => a + b, 0) / ps.length;
    const dif = p - media, txt = (dif >= 0 ? '+' : '−') + Math.abs(dif).toFixed(1).replace('.', ',');
    const enJuego = nRes(j) < 15;
    return '<tr data-ir-j="' + j.numero + '"><td>J' + j.numero + (enJuego ? ' <span class="pill">en juego</span>' : '') + '</td><td><b>' + p + '</b></td>'
      + '<td>' + (puesto === 1 && !enJuego ? '🏅 ' : '') + puesto + 'º <span class="muted">de ' + ps.length + '</span></td>'
      + '<td class="' + (dif >= 0 ? 'mas' : 'menos') + '">' + txt + '</td><td>' + (plenoAcertado(j, id) ? '🎯' : '') + '</td></tr>';
  }).join('');
  return '<div class="tabla-wrap"><table class="clasif mis-jornadas"><thead><tr><th>Jornada</th><th title="Aciertos">Acier.</th><th>Puesto</th><th title="Diferencia con la media del grupo">vs media</th><th title="Pleno al 15">P15</th></tr></thead><tbody>' + filas + '</tbody></table></div>'
    + '<p class="muted">Toca una jornada para ver su boleto.</p>';
}

/** Datos curiosos del jugador sacados de todas sus jornadas */
function curiosidadesHtml(id, js, jugs) {
  const items = [];
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  // Acierto según el signo que pone
  const porSigno = { '1': [0, 0], 'X': [0, 0], '2': [0, 0] };
  // Equipos: aciertos en los partidos de cada equipo
  const equipos = {};
  // Racha de partidos seguidos acertados
  let racha = 0, mejorRacha = 0;
  // Solo, contra todos
  let solo = 0, unicoFallo = 0;
  // Coincidencia con cada rival
  const coinc = {};
  js.forEach(j => {
    const mio = j.pronosticos[id];
    if (!Array.isArray(mio)) return;
    for (let i = 0; i < 14; i++) {
      const r = j.resultados[i], s = mio[i];
      jugs.forEach(o => { if (o.id === id) return; const su = j.pronosticos[o.id]; if (Array.isArray(su) && su[i]) { const c = coinc[o.id] = coinc[o.id] || [0, 0]; c[1]++; if (su[i] === s) c[0]++; } });
      if (!r || !porSigno[s]) continue;
      const ok = s === r;
      porSigno[s][1]++; if (ok) porSigno[s][0]++;
      const pt = j.partidos[i] || {};
      [pt.local, pt.visitante].forEach(eq => { if (!eq) return; const e = equipos[eq] = equipos[eq] || [0, 0]; e[1]++; if (ok) e[0]++; });
      if (ok) { racha++; mejorRacha = Math.max(mejorRacha, racha); } else racha = 0;
      const otros = jugs.filter(o => o.id !== id && Array.isArray(j.pronosticos[o.id]));
      if (otros.length) {
        const aciertanOtros = otros.filter(o => j.pronosticos[o.id][i] === r).length;
        if (ok && aciertanOtros === 0) solo++;
        if (!ok && aciertanOtros === otros.length) unicoFallo++;
      }
    }
  });
  const signos = ['1', 'X', '2'].filter(k => porSigno[k][1] >= 5);
  if (signos.length) {
    const mejor = signos.reduce((a, b) => pct(...porSigno[b]) > pct(...porSigno[a]) ? b : a);
    items.push(['🎲', 'Tu signo de la suerte', 'El ' + mejor, 'Cuando lo pones aciertas el ' + pct(...porSigno[mejor]) + '% (' + signos.map(k => k + ': ' + pct(...porSigno[k]) + '%').join(' · ') + ')']);
  }
  const eqs = Object.keys(equipos).filter(e => equipos[e][1] >= 3);
  if (eqs.length >= 2) {
    const orden = eqs.slice().sort((a, b) => pct(...equipos[b]) - pct(...equipos[a]) || equipos[b][1] - equipos[a][1]);
    const t = orden[0], m = orden[orden.length - 1];
    items.push(['🍀', 'Equipo talismán', esc(t), 'Aciertas el ' + pct(...equipos[t]) + '% de sus partidos (' + equipos[t][0] + ' de ' + equipos[t][1] + ')']);
    items.push(['🙈', 'Equipo gafe', esc(m), 'Solo aciertas el ' + pct(...equipos[m]) + '% de sus partidos (' + equipos[m][0] + ' de ' + equipos[m][1] + ')']);
  }
  items.push(['🔥', 'Mejor racha', mejorRacha + ' aciertos seguidos', 'Partido tras partido, sin fallar ninguno']);
  items.push(['🔮', 'Aciertos en solitario', solo, solo === 1 ? 'Partido que solo acertaste tú' : 'Partidos que solo acertaste tú']);
  items.push(['🤦', 'Fallos en solitario', unicoFallo, unicoFallo === 1 ? 'Partido que acertaron todos menos tú' : 'Partidos que acertaron todos menos tú']);
  const rivales = Object.keys(coinc).filter(k => coinc[k][1] >= 14);
  if (rivales.length >= 2) {
    const nombre = k => (jugs.find(o => o.id === k) || {}).nombre || '';
    const orden = rivales.slice().sort((a, b) => pct(...coinc[b]) - pct(...coinc[a]));
    const a = orden[0], z = orden[orden.length - 1];
    items.push(['👯', 'Tu alma gemela', esc(nombre(a)), 'Pone lo mismo que tú en el ' + pct(...coinc[a]) + '% de los partidos']);
    items.push(['🙃', 'Tu polo opuesto', esc(nombre(z)), 'Solo coincidís en el ' + pct(...coinc[z]) + '% de los partidos']);
  }
  return '<div class="curiosidades">' + items.map(x => '<div class="curio"><span class="ico">' + x[0] + '</span><div><small>' + x[1] + '</small><b>' + x[2] + '</b><p>' + x[3] + '</p></div></div>').join('') + '</div>';
}

  if (ocultos) {

      + jugs.filter(g => g.activo).map(g => '<span class="enviado' + (j.pronosticos[g.id] !== undefined ? ' si' : '') + '">' + (j.pronosticos[g.id] !== undefined ? '✓ ' : '⏳ ') + esc(g.nombre) + '</span>').join('')

    html += '<div class="card"><h3>Los partidos</h3>' + tablaBoleto(j, []) + '</div>';
  } else {
    if (!j.cerrada && !j.anulada) html += tarjetaEnviados(j, jugs);

  return html;
}

function tablaBoleto(j, jugs) {
  const consenso = jugs.length > 1 && Object.values(j.pronosticos).some(Array.isArray);
  let h = '<div class="tabla-wrap"><table class="boleto"><thead><tr><th class="c-partido">Partido</th><th class="c-res"><div class="vertical">Resultado</div></th>';
  jugs.forEach(g => { h += '<th class="c-jug" title="' + esc(g.nombre) + '"><div class="vertical">' + esc(g.nombre) + '</div></th>'; });
  if (consenso) h += '<th class="c-cons" title="El más votado (el que va al Pleno al 15 oficial)"><div class="vertical">Más votado</div></th>';
  h += '</tr></thead><tbody>';
  j.partidos.forEach((p, i) => {
    const r = j.resultados[i];
    h += '<tr><td class="c-partido">' + partidoHtml(p, i) + '</td><td class="c-res">' + (r ? '<span class="sg res' + (i === 14 ? ' pleno' : '') + '">' + esc(r) + '</span>' : '<span class="sg vacio">–</span>') + '</td>';
    jugs.forEach(g => {
      const pr = j.pronosticos[g.id];
      const v = Array.isArray(pr) ? pr[i] : '';
      const cls = !v ? 'vacio' : !r ? '' : (v === r || (i < 14 && /^[1X2]{2,3}$/.test(r) && r.includes(v))) ? 'ok' : 'ko';
      h += '<td class="c-jug"><span class="sg ' + cls + (i === 14 ? ' pleno' : '') + '">' + (v ? esc(v) : '·') + '</span></td>';
    });
    if (consenso) {
      const mv = masVotado(j, i);
      const txt = mv ? mv.signos.join('/') : '';
      const cls = !mv ? 'vacio' : !r ? '' : mv.signos.includes(r) ? 'ok' : 'ko';
      h += '<td class="c-cons"><span class="sg ' + cls + (i === 14 ? ' pleno' : '') + '" title="' + (mv ? mv.votos + ' votos' : '') + '">' + (txt ? esc(txt) : '·') + '</span></td>';
    }
    h += '</tr>';
  });
  h += '</tbody>';
  if (jugs.length) {
    const pts = jugs.map(g => j.aciertos ? (j.aciertos[g.id] === undefined ? null : j.aciertos[g.id]) : puntos(j, g.id));
    const max = Math.max(...pts.filter(x => x !== null), 0);
    h += '<tfoot><tr><td class="c-partido">Aciertos</td><td class="c-res"></td>'
      + pts.map(x => '<td class="' + (x !== null && x === max && max > 0 ? 'top' : '') + '">' + (x === null ? '–' : x) + '</td>').join('')
      + (consenso ? '<td class="c-cons"></td>' : '') + '</tr></tfoot>';
  }
  return h + '</table></div>';
}

function horaActualizacion(iso) {
  const d = new Date(iso);
  const hora = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  const txt = d.toDateString() === new Date().toDateString() ? 'hoy a las ' + hora : fmtFecha(iso);
  const min = Math.round((Date.now() - d) / 60000);
  return txt + (min < 60 ? ' (' + (min < 1 ? 'ahora mismo' : 'hace ' + min + ' min') + ')' : '');
}

function botonWhatsApp(j) {
  if (j.anulada || !Object.keys(j.pronosticos).length) return '';
  return '<div class="acciones"><button class="btn btn-wa btn-bloque" id="b-wa">📲 Enviar columnas por WhatsApp</button></div>';
}
function mensajeWhatsApp(j, pron) {
  const cols = S.datos.jugadores.filter(g => g.activo)
    .sort((a, b) => (a.columna || 99) - (b.columna || 99) || a.nombre.localeCompare(b.nombre))
    .map((g, k) => ({ n: String(g.columna || k + 1), s: Array.isArray(pron[g.id]) ? pron[g.id] : null }));
  const w = Math.max(1, ...cols.map(c => c.n.length));
  const celda = v => String(v).padEnd(w);
  // Pleno al 15 más votado (va solo en la columna 1)
  const cuenta = {};
  cols.forEach(c => { const v = c.s && c.s[14]; if (/^[012M]-[012M]$/.test(v || '')) cuenta[v] = (cuenta[v] || 0) + 1; });
  const max = Math.max(0, ...Object.values(cuenta));
  const top = Object.keys(cuenta).filter(k => cuenta[k] === max);
  const lineas = ['⚽ *' + (S.datos.config.nombre || 'Liga Lupinos').toUpperCase() + ' · J' + j.numero + '*'];
  // Bloque en letra de ancho fijo: las ``` van pegadas al texto (si no, algunos móviles no lo alinean)
  // y solo se usan caracteres ASCII, que miden todos lo mismo en cualquier teléfono.
  // Las barras evitan que WhatsApp tome filas como "2 2 2 2" por números de teléfono.
  const sep = ' | ';
  const cabecera = cols.map(c => celda(c.n)).join(sep).trimEnd();
  const bloque = [cabecera, '='.repeat(cabecera.length)];
  for (let i = 0; i < 14; i++) bloque.push(cols.map(c => celda(c.s && c.s[i] ? c.s[i] : '-')).join(sep).trimEnd());
  bloque.push(!max ? '-' : top.length === 1 ? top[0] : '??');
  lineas.push('```' + bloque.join('\n') + '```');
  if (max && top.length > 1) lineas.push('⭐ Pleno al 15: empate entre *' + top.join('* y *') + '* (' + (max === 1 ? '1 voto' : max + ' votos') + ' cada uno). ¡Elegid vosotros!');
  else if (max) lineas.push('⭐ Pleno al 15 (columna 1): *' + top[0] + '* (' + (max === 1 ? '1 voto' : max + ' votos') + ')');
  const faltan = cols.filter(c => !c.s).map(c => c.n);
  if (faltan.length) lineas.push('⚠️ Sin pronóstico: columna ' + faltan.join(', '));
  return lineas.join('\n');
}
async function enviarWhatsApp(boton) {

function enlazarSelector(idCont, valores, opciones = {}) {
  const cont = document.getElementById(idCont);
  cont.addEventListener('click', e => {
    const b = e.target.closest('button.sig');
    if (!b) return;
    const i = Number(b.dataset.i), v = b.dataset.v;
    if (i < 14) {
      valores[i] = (opciones.permitirVacio && valores[i] === v) ? '' : v;
      cont.querySelectorAll('button[data-i="' + i + '"]').forEach(x => x.classList.toggle('on', x.dataset.v === valores[i]));
    } else {
      const lado = Number(b.dataset.lado);
      const pl = (valores[14] || '-').split('-');
      while (pl.length < 2) pl.push('');
      pl[lado] = (opciones.permitirVacio && pl[lado] === v) ? '' : v;
      valores[14] = pl[0] || pl[1] ? pl[0] + '-' + pl[1] : '';
      cont.querySelectorAll('button[data-i="14"][data-lado="' + lado + '"]').forEach(x => x.classList.toggle('on', x.dataset.v === pl[lado]));
    }
    if (opciones.alCambiar) opciones.alCambiar();
  });
}

function cargarHistorico() {
  if (S.hist || S.cargandoHist) return;

  if (S.histGuardado) { S.hist = S.histGuardado; S.histGuardado = null; S.cargandoHist = true; api('historico').then(r => { S.hist = r; almacen.set('lupinos_historico', r); if (S.vista === 'clasificacion' && !$('#capa-modal').innerHTML) render(); }).catch(() => {}).finally(() => { S.cargandoHist = false; }); return; }

function puestos(clas) {
  let pos = 0;
  return clas.map((c, i) => { if (i === 0 || c.puntos !== clas[i - 1].puntos) pos = i + 1; return Object.assign({ pos: c.pos || pos }, c); });
}
function vistaTemporadaArchivada(t) {

  let h = '<div class="podio">' + escalon(filas[1], 1) + escalon(filas[0], 0) + escalon(filas[2], 2) + '</div>';

  });
  h += '</tbody></table><div class="leyenda"><span>🟩 Campeón</span><span>🟥 Colista</span></div></div>';
  // Jornadas de la temporada

    + '</div>' + tablaBoleto(j, nombres.map(n => ({ id: n, nombre: n }))) + '<p class="muted" style="margin-top:8px">Aciertos tal y como se apuntaron en su día.</p></div>';
  return h;
}
function vistaPalmares() {
  const ts = S.hist.temporadas.slice().sort((a, b) => a.orden - b.orden);
  const eq = {};
  const fila = n => eq[n] || (eq[n] = { nombre: n, oros: 0, platas: 0, bronces: 0, temporadas: 0, titulos: [] });
  ts.forEach(t => {
    puestos(t.clasificacion).forEach(f => {
      const e = fila(f.nombre); e.temporadas++;
      if (f.pos === 1) { e.oros++; e.titulos.push(t.nombre); } else if (f.pos === 2) e.platas++; else if (f.pos === 3) e.bronces++;
    });
  });
  const lista = Object.values(eq).sort((a, b) => b.oros - a.oros || b.platas - a.platas || b.bronces - a.bronces || a.nombre.localeCompare(b.nombre));
  let h = '<div class="card"><h2>🏆 Palmarés</h2><p class="muted">Títulos y podios de las temporadas terminadas.</p>'
    + '<table class="clasif palmares"><thead><tr><th></th><th>Equipo</th><th title="Ligas ganadas">🏆</th><th title="Subcampeón">🥈</th><th title="Tercero">🥉</th><th title="Temporadas jugadas">Temp.</th></tr></thead><tbody>';
  lista.forEach((e, i) => {
    h += '<tr class="' + (e.oros && e.oros === lista[0].oros ? 'lider' : '') + '"><td>' + (i + 1) + 'º</td><td class="nom">' + esc(e.nombre)
      + (e.titulos.length ? '<br><small class="muted" style="font-weight:400">Campeón ' + e.titulos.map(esc).join(', ') + '</small>' : '') + '</td>'
      + '<td class="pts">' + (e.oros || '–') + '</td><td>' + (e.platas || '–') + '</td><td>' + (e.bronces || '–') + '</td><td>' + e.temporadas + '</td></tr>';
  });
  h += '</tbody></table></div><div class="card campeones"><h3>Campeones por temporada</h3><div class="lista">';
  ts.slice().reverse().forEach(t => {
    const p = puestos(t.clasificacion);
    const camp = p.filter(f => f.pos === 1), sub = p.filter(f => f.pos === 2);
    h += '<div class="item"><div class="info"><b>' + esc(t.nombre) + ' · 🏆 ' + camp.map(f => esc(f.nombre)).join(' y ') + ' <small class="muted">(' + (camp[0] ? camp[0].puntos : 0) + ' pts)</small></b>'
      + '<small>🥈 ' + (sub.map(f => esc(f.nombre) + ' (' + f.puntos + ')').join(', ') || '–') + '</small></div>'
      + '<button class="btn btn-claro btn-peq" data-temp="' + esc(t.id) + '">Ver</button></div>';
  });
  return h + '</div></div>';
}

function vistaClasificacion() {
  cargarHistorico();
  const sel = selectorTemporadas();
  if (S.histSel !== 'actual' && S.hist) {
    if (S.histSel === 'palmares') return sel + vistaPalmares();
    const t = S.hist.temporadas.find(x => x.id === S.histSel);
    if (t) return sel + vistaTemporadaArchivada(t);
    S.histSel = 'actual';
  }
  return sel + vistaClasificacionActual();
}

function vistaClasificacionActual() {
  const filas = clasificacion();
  const js = jornadasQueCuentan();
  if (!filas.length || !js.some(j => nRes(j))) return '<div class="card vacio"><div class="grande">🏆</div><h2>Clasificación</h2><p>Aparecerá en cuanto haya resultados.</p></div>';
  const max = filas[0].total, min = filas[filas.length - 1].total;
  const medallas = ['🥇', '🥈', '🥉'];
  const top = filas.slice(0, 3);
  const escalon = (f, k) => f ? '<div class="escalon e' + (k + 1) + '"><div class="medalla">' + medallas[f.pos - 1 > 2 ? 2 : f.pos - 1] + '</div><div class="nombre">' + esc(f.g.nombre) + '</div><div class="bloque"><div class="p">' + f.total + '</div><div class="pts">PUNTOS</div></div></div>' : '<div></div>';
  let h = '<div class="podio">' + escalon(top[1], 1) + escalon(top[0], 0) + escalon(top[2], 2) + '</div>';

  h += '<div class="card"><h2>Clasificación general</h2><table class="clasif"><thead><tr><th>Pos</th><th>Jugador</th><th>Pts</th><th>Últ.</th><th title="Plenos al 15 acertados">P15</th></tr></thead><tbody>';
  filas.forEach(f => {
    const ultPos = filas[filas.length - 1].pos;
    const cls = f.pos === 1 ? 'lider' : (ultPos > 1 && f.pos === ultPos ? 'colista' : '');
    let flecha = '';
    if (f.antes) {
      const d = f.antes - f.pos;
      flecha = d > 0 ? '<span class="flecha" style="color:var(--ok)">▲' + d + '</span>' : d < 0 ? '<span class="flecha" style="color:var(--ko)">▼' + (-d) + '</span>' : '';
    }
    h += '<tr class="' + cls + '" data-ficha="' + esc(f.g.id) + '" title="Ver la ficha de ' + esc(f.g.nombre) + '"><td>' + f.pos + 'º</td><td class="nom">' + esc(f.g.nombre) + ' ' + flecha + '</td><td class="pts">' + f.total + '</td><td>' + (f.ultima == null ? '–' : f.ultima) + '</td><td>' + (f.plenos || '–') + '</td></tr>';
  });
  h += '</tbody></table><div class="leyenda"><span>🟩 Líder</span><span>🟥 Colista</span><span>P15 = Plenos al 15 acertados</span><span>⚖️ Empate a puntos: deciden los plenos al 15 y, si siguen empatados, quién ganó más jornadas a los otros empatados</span><span>👆 Toca un jugador para ver su ficha</span></div></div>';

  // Matriz por jornadas
  const conRes = js.filter(j => nRes(j));
  h += '<div class="card"><h3>Jornada a jornada</h3><div class="tabla-wrap"><table class="matriz"><thead><tr><th class="c-nom">Jugador</th>'
    + conRes.map(j => '<th>J' + j.numero + '</th>').join('') + '<th>Total</th></tr></thead><tbody>';
  const mejores = conRes.map(j => Math.max(...filas.map(f => puntos(j, f.g.id) || 0)));
  filas.forEach(f => {
    h += '<tr><td class="c-nom">' + esc(f.g.nombre) + '</td>'
      + conRes.map((j, k) => { const p = puntos(j, f.g.id); return '<td class="' + (p !== null && p === mejores[k] && p > 0 ? 'mejor' : '') + '">' + (p === null ? '–' : p) + '</td>'; }).join('')
      + '<td class="total">' + f.total + '</td></tr>';
  });
  h += '</tbody></table></div><div class="leyenda"><span style="background:#fff3c4;padding:2px 8px;border-radius:6px;color:#7a5a00;font-weight:700">8</span> Mejor de la jornada</div></div>';
  return h;
}

function enlazar() {
  const chips = $('#chips');
  if (chips) {
    chips.addEventListener('click', e => { const b = e.target.closest('[data-j]'); if (b) { S.jSel = Number(b.dataset.j); render(); } });
    const act = chips.querySelector('.activo');
    if (act) act.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  const br = $('#b-rellenar');
  if (br) br.onclick = abrirRellenar;
  const bw = $('#b-wa');
  if (bw) bw.onclick = () => enviarWhatsApp(bw);
  const bp = $('#b-premios');
  if (bp) bp.onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(mensajePremios(getJ(S.jSel))), '_blank');
  const bi = $('#b-instalar');
  if (bi) bi.onclick = instalarApp;
  const bix = $('#b-instalar-x');
  if (bix) bix.onclick = () => { almacen.set('lupinos_sin_instalar', 1); render(); };
  if (S.vista === 'clasificacion' && S.histSel === 'actual') $('#app').querySelectorAll('tr[data-ficha]').forEach(tr => tr.onclick = () => abrirFicha(tr.dataset.ficha));
  const ba = $('#b-actualizar');
  if (ba) ba.onclick = () => actualizarResultadosWeb(ba);
  if (S.vista === 'noticias') $('#app').querySelectorAll('[data-medio]').forEach(b => b.onclick = () => { S.medio = b.dataset.medio; render(); });
  if (S.vista === 'clasificacion') {
    $('#app').querySelectorAll('[data-temp]').forEach(b => b.onclick = () => { S.histSel = b.dataset.temp; S.histJSel = null; render(); window.scrollTo({ top: 0 }); });

/* ─────────────── Premios de la jornada ─────────────── */
function premiosJornada(j) {
  const jugs = jugadoresVisibles().filter(g => Array.isArray(j.pronosticos[g.id]));
  if (!jugs.length) return null;
  const pts = jugs.map(g => ({ g, p: puntos(j, g.id) }));
  const max = Math.max(...pts.map(x => x.p)), min = Math.min(...pts.map(x => x.p));
  const unicos = {};
  for (let i = 0; i < 14; i++) {
    const r = j.resultados[i];
    if (!r) continue;
    const acertantes = jugs.filter(g => j.pronosticos[g.id][i] === r);
    if (acertantes.length === 1) (unicos[acertantes[0].id] = unicos[acertantes[0].id] || []).push(i);
  }
  return {
    mejores: pts.filter(x => x.p === max), max,
    peores: max !== min ? pts.filter(x => x.p === min) : [], min,
    visionarios: Object.keys(unicos).map(id => ({ g: jugs.find(x => x.id === id), partidos: unicos[id] })),
    plenos: jugs.filter(g => plenoAcertado(j, g.id))
  };
}
function listaNombres(ns) { return ns.length > 1 ? ns.slice(0, -1).join(', ') + ' y ' + ns[ns.length - 1] : (ns[0] || ''); }
function nombresPremio(lista) { return listaNombres(lista.map(x => x.nombre || (x.g && x.g.nombre))); }
function partidoTexto(j, i) { const p = j.partidos[i] || {}; return (p.local || '') + '–' + (p.visitante || ''); }
function tarjetaPremios(j) {
  const pr = premiosJornada(j);

    ? caja('🔮', 'Visionario', nombresPremio(pr.visionarios), 'Único en acertar ' + pr.visionarios.map(v => v.partidos.map(i => partidoTexto(j, i)).join(', ')).join(' · '))
    : caja('🔮', 'Visionario', 'Nadie', 'Ningún acierto en solitario');
  h += caja('🎯', 'Pleno al 15', pr.plenos.length ? listaNombres(pr.plenos.map(g => g.nombre)) : 'Nadie', 'Resultado: ' + (j.resultados[14] || '–'));
  return h + '</div><button class="btn btn-wa btn-bloque" id="b-premios">📣 Enviar premios por WhatsApp</button></div>';
}
function mensajePremios(j) {
  const pr = premiosJornada(j);

/* ─────────────── Ficha de jugador ─────────────── */
function clasificacionHasta(js, jugs) {
  const filas = jugs.map(g => {
    const por = js.map(j => puntos(j, g.id));
    return { id: g.id, nombre: g.nombre, por, total: por.reduce((a, b) => a + (b || 0), 0), plenos: js.filter(j => plenoAcertado(j, g.id)).length };
  });
  return ordenarClasificacion(filas, f => f.nombre);
}
function graficaPuesto(serie, nJug) {
  const W = 320, H = 150, iz = 26, de = 10, ar = 12, ab = 22;
  const x = k => iz + (serie.length === 1 ? (W - iz - de) / 2 : k * (W - iz - de) / (serie.length - 1));
  const y = p => ar + (nJug === 1 ? 0 : (p - 1) * (H - ar - ab) / (nJug - 1));
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Puesto en la clasificación después de cada jornada">';
  const marcas = nJug <= 6 ? Array.from({ length: nJug }, (_, k) => k + 1) : [1, Math.ceil(nJug / 2), nJug];
  marcas.forEach(p => { s += '<line x1="' + iz + '" x2="' + (W - de) + '" y1="' + y(p) + '" y2="' + y(p) + '" stroke="#e6ece7" stroke-width="1"/><text x="' + (iz - 6) + '" y="' + (y(p) + 4) + '" text-anchor="end" font-size="10" fill="#6b7a70">' + p + 'º</text>'; });
  const paso = Math.max(1, Math.ceil(serie.length / 8));
  serie.forEach((d, k) => { if (k % paso === 0 || k === serie.length - 1) s += '<text x="' + x(k) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#6b7a70">J' + d.j + '</text>'; });
  s += '<polyline fill="none" stroke="#0b5d2a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' + serie.map((d, k) => x(k) + ',' + y(d.pos)).join(' ') + '"/>';
  serie.forEach((d, k) => {
    s += '<circle cx="' + x(k) + '" cy="' + y(d.pos) + '" r="4" fill="#0b5d2a" stroke="#fff" stroke-width="2"/>'
      + '<circle class="hit" cx="' + x(k) + '" cy="' + y(d.pos) + '" r="14" fill="transparent" data-tip="J' + d.j + ' · ' + d.pos + 'º · ' + d.pts + ' pts"/>';
  });
  const u = serie[serie.length - 1];
  s += '<text x="' + Math.min(x(serie.length - 1), W - de) + '" y="' + (y(u.pos) - 9) + '" text-anchor="end" font-size="11" font-weight="700" fill="#0f1d14">' + u.pos + 'º</text>';
  return s + '</svg>';
}

    + dato('Ganadas', ganadas, ganadas === 1 ? 'jornada' : 'jornadas')

/* ─────────────── Noticias de Primera ─────────────── */
function haceCuanto(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return 'hace ' + min + ' min';
  const h = Math.round(min / 60);
  if (h < 24) return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
  const d = Math.round(h / 24);
  return 'hace ' + d + (d === 1 ? ' día' : ' días');
}
function cargarNoticias(forzar) {
  if (S.cargandoNoticias || (S.noticias && !forzar && Date.now() - S.noticias.cargadas < 10 * 60000)) return;
  S.cargandoNoticias = true;
  api('noticias').then(r => { S.noticias = { lista: r.noticias || [], cargadas: Date.now() }; if (!DEMO) almacen.set('lupinos_noticias', S.noticias.lista); })
    .catch(e => { if (!S.noticias) S.noticias = { lista: [], error: e.message, cargadas: Date.now() }; })
    .finally(() => { S.cargandoNoticias = false; if (S.vista === 'noticias') render(); });
}
function vistaNoticias() {
  cargarNoticias();

  const lista = S.noticias.lista;
  if (!lista.length) return '<div class="card vacio"><h2>Noticias de Primera</h2><p>' + (S.noticias.error ? 'No se han podido cargar las noticias. Prueba en un rato.' : 'No hay noticias ahora mismo.') + '</p></div>';
  const medios = [...new Set(lista.map(n => n.medio))];
  const filtro = medios.includes(S.medio) ? S.medio : '';
  const vis = lista.filter(n => !filtro || n.medio === filtro);
  return '<div class="card"><h2>Noticias de Primera</h2>'
    + '<div class="medios">' + ['', ...medios].map(m => '<button data-medio="' + esc(m) + '" class="' + (m === filtro ? 'activo' : '') + '">' + esc(m || 'Todas') + '</button>').join('') + '</div>'
    + '<div class="noticias">' + vis.map(n => '<a class="noticia" href="' + esc(n.enlace) + '" target="_blank" rel="noopener noreferrer">'
      + (n.imagen ? '<img src="' + esc(n.imagen) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : '')
      + '<div class="tx"><b>' + esc(n.titulo) + '</b>' + (n.resumen ? '<p>' + esc(n.resumen) + '</p>' : '')
      + '<small>' + esc(n.medio) + ' · ' + esc(haceCuanto(n.fecha)) + '</small></div></a>').join('') + '</div>'
    + '<p class="muted" style="margin-top:10px">Titulares de Marca, AS y Mundo Deportivo. Al tocar una noticia se abre en su web.</p></div>';
}

/* ─────────────── Banner de resultados en directo ─────────────── */
function textoDirecto(p) {
  const sig = (p.gl === null || p.gl === undefined || p.gv === null || p.gv === undefined) ? '' : (p.gl > p.gv ? '1' : p.gl < p.gv ? '2' : 'X');
  if (p.estado === 'in' || p.estado === 'post') {
    const min = p.estado === 'post' ? 'Final' : (/^HT$|half/i.test(p.detalle) ? 'Desc.' : (p.detalle || 'En juego'));
    return { cls: p.estado, marcador: esc(p.local) + ' <span class="mar">' + p.gl + '-' + p.gv + '</span> ' + esc(p.visitante), min, sig };
  }
  if (p.resultado) return { cls: 'post', marcador: esc(p.local) + ' – ' + esc(p.visitante), min: 'Final', sig: p.resultado };
  const d = p.inicio ? new Date(p.inicio) : null;
  const min = d && !isNaN(d) ? d.toLocaleDateString('es-ES', { weekday: 'short' }).replace('.', '') + ' ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) : '';
  return { cls: 'pre', marcador: esc(p.local) + ' – ' + esc(p.visitante), min, sig: '' };
}
function pintarDirecto(r) {
  const caja = $('#directo');
  const empezado = r && r.partidos && r.partidos.some(p => p.estado === 'in' || p.estado === 'post' || p.resultado);
  if (!empezado) { caja.hidden = true; return; }
  const vivo = r.partidos.some(p => p.estado === 'in');
  const etq = $('#directo-etq');
  etq.className = 'directo-etq' + (vivo ? ' vivo' : '');
  etq.textContent = vivo ? 'En directo' : 'J' + r.numero;
  const items = r.partidos.map(p => {
    const t = textoDirecto(p);
    return '<span class="dx ' + t.cls + '"><span class="n">' + (p.pos === 15 ? 'P15' : p.pos) + '</span>' + t.marcador
      + (t.min ? ' <span class="min">' + esc(t.min) + '</span>' : '') + (t.sig ? ' <span class="dsig">' + esc(t.sig) + '</span>' : '') + '</span>';
  }).join('');
  const pista = $('#directo-pista');
  if (pista.dataset.html !== items) {
    pista.dataset.html = items;
    pista.innerHTML = items + items;  // dos copias para que el bucle no se corte
    caja.hidden = false;
    requestAnimationFrame(() => pista.style.setProperty('--dur', Math.max(20, Math.round(pista.scrollWidth / 2 / 45)) + 's'));
  }
  caja.hidden = false;
}
async function actualizarDirecto() {
  if (document.hidden) return;
  try { pintarDirecto(await api('enDirecto')); } catch (e) { /* si falla, se reintenta en el siguiente minuto */ }

  const elige = a => a[Math.floor(rnd() * a.length)];
  const nombres = ['Renos Pachuchos', 'Miranda', 'Miguel G', 'Payasos Dopados', 'Ansola', 'Futneral Old Boys', 'Drinkteam', 'Yei-Yei'];
  const equipos = ['Real Madrid', 'Barcelona', 'Atlético', 'Athletic', 'Real Sociedad', 'Betis', 'Sevilla', 'Villarreal', 'Valencia', 'Celta', 'Osasuna', 'Getafe', 'Mallorca', 'Rayo', 'Girona', 'Alavés', 'Espanyol', 'Levante', 'Elche', 'Oviedo', 'Racing', 'Sporting', 'Zaragoza', 'Málaga', 'Deportivo', 'Almería', 'Cádiz', 'Granada', 'Huesca', 'Leganés'];

  const signo = () => { const r = rnd(); return r < .45 ? '1' : r < .75 ? 'X' : '2'; };
  const gol = () => elige(['0', '1', '1', '2', '2', 'M']);
  const db = { config: { nombre: 'Liga Lupinos', temporada: 'Temporada 2026/27 · DEMO', mostrarAntesCierre: true }, admin: 'lupinos', jugadores: [], jornadas: [], registro: [] };
  nombres.forEach((n, i) => db.jugadores.push({ id: 'd' + i, nombre: n, columna: i + 1, activo: true, pin: '1234' }));
  const ahora = Date.now();
  for (let n = 1; n <= 5; n++) {
    const eqs = equipos.slice().sort(() => rnd() - .5);
    const partidos = [];
    for (let i = 0; i < 15; i++) partidos.push({ local: eqs[i * 2], visitante: eqs[i * 2 + 1], fecha: elige(dias) });
    const abierta = n === 5;
    const cierre = new Date(ahora + (abierta ? 2.3 : -(5 - n) * 7 + 0.1) * 864e5).toISOString();

        const nom = {}; DB.jugadores.forEach(g => { nom[g.id] = g.nombre; });
        const tot = {}, jug = {};
        const jornadas = DB.jornadas.slice().sort((a, b) => a.numero - b.numero).map(j => { const pron = {}, aci = {};
          Object.keys(j.pronosticos).forEach(gid => { const pr = j.pronosticos[gid]; const n = nom[gid] || gid; let a = 0; j.resultados.forEach((r, i) => { if (r && pr[i] === r) a++; }); pron[n] = pr; aci[n] = a; if (!j.anulada) { tot[n] = (tot[n] || 0) + a; jug[n] = (jug[n] || 0) + 1; } });
          return { numero: j.numero, partidos: j.partidos, resultados: j.resultados, pronosticos: pron, aciertos: aci, anulada: !!j.anulada }; });
        const vale = jornadas.filter(j => !j.anulada);
        const clasificacion = ordenarClasificacion(Object.keys(tot).map(n => ({ nombre: n, total: tot[n], jugadas: jug[n], plenos: vale.filter(j => j.pronosticos[n] && j.resultados[14] && j.pronosticos[n][14] === j.resultados[14]).length, por: vale.map(j => (j.aciertos[n] === undefined ? null : j.aciertos[n])) })), x => x.nombre)
          .map(f => ({ nombre: f.nombre, puntos: f.total, jugadas: f.jugadas, plenos: f.plenos, pos: f.pos }));
        DB.historico.push({ id, nombre: p.nombre, orden: DB.historico.length + 1, clasificacion, notas: '', jornadas });
        DB.jornadas = []; DB.jugadores.forEach(g => { g.activo = (p.siguen || []).includes(g.id); });
        if (p.nuevaTemporada) DB.config.temporada = p.nuevaTemporada;
        log('Temporada', '', '', 'archivada ' + p.nombre, 'admin'); return { id, nombre: p.nombre, jornadas: jornadas.length, campeon: clasificacion[0] || null }; }
      case 'enDirecto': {
        const j = DB.jornadas.slice().sort((a, b) => b.numero - a.numero).find(x => !x.anulada && x.partidos.some(pp => pp.local));
        if (!j) return { numero: null, partidos: [] };
        const ahora = Date.now();
        return { numero: j.numero, partidos: j.partidos.map((pp, i) => ({ pos: i + 1, local: pp.local, visitante: pp.visitante, resultado: '',
          estado: i < 5 ? 'post' : i < 8 ? 'in' : 'pre', gl: i < 8 ? (i * 7) % 4 : null, gv: i < 8 ? (i * 3) % 3 : null,
          detalle: i < 5 ? 'FT' : i === 6 ? 'HT' : (30 + i * 7) + "'", inicio: new Date(ahora + (i - 7) * 3600e3).toISOString() })) };
      }
      case 'noticias': {
        const medios = ['Marca', 'AS', 'Mundo Deportivo'];
        const titulares = ['El líder gana y se escapa en la tabla', 'Un central se lesiona y será baja tres semanas', 'El derbi ya tiene horario', 'El entrenador renueva hasta 2028', 'Polémica arbitral en el último partido', 'El mercado de invierno se mueve'];
        return { noticias: titulares.map((t, i) => ({ titulo: t + ' (demo)', enlace: 'https://example.com/noticia-' + i, fecha: new Date(Date.now() - (i * 95 + 7) * 60000).toISOString(), imagen: '', resumen: 'Noticia inventada para el modo demo.', medio: medios[i % 3] })) };
      }
      case 'marcarNoJugada': adm(); jor(p.numero).anulada = !!p.anulada; log('Jornada', p.numero, '', p.anulada ? 'marcada como NO SE JUEGA' : 'vuelve a contar', 'admin'); return { ok: true };
      case 'buscarResultados': adm(); throw new Error('En el modo demo no se consulta la web de Loterías.');
      case 'cargarBoleto': adm(); throw new Error('En el modo demo no se consulta la web. Usa "Pegar lista".');
      case 'guardarPronosticoAdmin': { adm(); const j = jor(p.numero); const g = DB.jugadores.find(x => x.id === p.jugadorId); if (p.borrar) delete j.pronosticos[p.jugadorId]; else j.pronosticos[p.jugadorId] = p.signos; log('Pronóstico', j.numero, g.nombre, p.borrar ? 'borrado' : p.signos.join(' '), 'admin'); return { ok: true }; }
      case 'guardarConfig': adm(); Object.assign(DB.config, p.config); return { ok: true };
      case 'cambiarContrasena': adm(); if ((p.nueva || '').length < 6) throw new Error('La contraseña debe tener al menos 6 caracteres.'); DB.admin = p.nueva; return { ok: true };
      case 'importar': { adm(); const d = p.datos; if (!d || !Array.isArray(d.jornadas)) throw new Error('Formato de importación no válido.'); let nuevos = 0;
        const idDe = n => { let g = DB.jugadores.find(x => x.nombre.toLowerCase() === String(n).toLowerCase()); if (!g) { g = { id: 'd' + Date.now() + nuevos, nombre: n, columna: 0, activo: true, pin: '' }; DB.jugadores.push(g); nuevos++; } return g.id; };
        (d.jugadores || []).forEach(x => { const id = idDe(x.nombre); const g = DB.jugadores.find(y => y.id === id); if (x.columna) g.columna = x.columna; });
        d.jornadas.forEach(j => { DB.jornadas = DB.jornadas.filter(x => x.numero !== j.numero); const pr = {}; Object.keys(j.pronosticos || {}).forEach(n => { pr[idDe(n)] = j.pronosticos[n]; });
          DB.jornadas.push({ numero: j.numero, oficial: j.oficial || '', cierre: '', partidos: Array.from({ length: 15 }, (_, i) => Object.assign({ local: '', visitante: '', fecha: '' }, (j.partidos || [])[i] || {})), resultados: Array.from({ length: 15 }, (_, i) => (j.resultados || [])[i] || ''), pronosticos: pr }); });
        log('Importación', '', '', d.jornadas.length + ' jornadas', 'admin'); return { jornadas: d.jornadas.length, jugadoresNuevos: nuevos }; }
      case 'registro': adm(); return copia(DB.registro.slice(0, 150));
    }
    throw new Error('Acción desconocida');
  });
}

/* ─────────────── Tema navideño automático ───────────────
   Del 1 de diciembre (0:00) al 6 de enero (23:59), hora de España, cada año.
   Para probarlo cualquier día: añade ?navidad=1 a la dirección (o ?navidad=0 para quitarlo). */
function esNavidad() {
  const q = new URLSearchParams(location.search).get('navidad');
  if (q === '1') return true;
  if (q === '0') return false;
  const p = {};
  new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', month: 'numeric', day: 'numeric' }).formatToParts(new Date()).forEach(x => { p[x.type] = Number(x.value); });
  return p.month === 12 || (p.month === 1 && p.day <= 6);
}
function aplicarTemporada() {
  const on = esNavidad();
  if (on === document.body.classList.contains('navidad')) return;
  document.body.classList.toggle('navidad', on);
  const nieve = $('#nieve');
  nieve.innerHTML = '';
  if (on) {
    let h = '';
    for (let i = 0; i < 34; i++) {
      const t = 9 + Math.random() * 12;
      h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;font-size:' + (8 + Math.random() * 14).toFixed(0) + 'px;animation-duration:' + t.toFixed(1) + 's;animation-delay:-' + (Math.random() * t).toFixed(1) + 's">' + (i % 3 ? '❄' : '•') + '</i>';
    }
    nieve.innerHTML = h;
  }
  pintarCabecera();
}

/* ─────────────── Arranque ─────────────── */
(async function iniciar() {
  if (DEMO) $('#banner-demo').innerHTML = '<div class="demo">MODO DEMO · datos inventados · PIN 1234 · admin: lupinos</div>';
  aplicarTemporada();
  setInterval(aplicarTemporada, 30000);
  S.sesion = almacen.get('lupinos_sesion') || almacen.get('lupinos_sesion', true);
  S.admin = almacen.get('lupinos_admin', true);
  const pos = almacen.get('lupinos_pos', true);
  if (pos && ['jornada', 'clasificacion', 'noticias', 'admin'].includes(pos.vista)) {
    S.vista = pos.vista;
    if (typeof pos.jSel === 'number') S.jSel = pos.jSel;
    if (pos.adminTab) S.adminTab = pos.adminTab;
    if (pos.histSel) S.histSel = pos.histSel;
    document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('activo', x.dataset.vista === S.vista));
  }
  // Arranque rápido: se enseña al momento lo que se vio la última vez y se actualiza por detrás
  const guardados = DEMO ? null : almacen.get('lupinos_datos');
  if (!DEMO) {
    const n = almacen.get('lupinos_noticias'); if (Array.isArray(n)) S.noticias = { lista: n, cargadas: 0 };
    const h = almacen.get('lupinos_historico'); if (h && h.temporadas) S.histGuardado = h;
  }
  if (guardados && Array.isArray(guardados.jornadas)) {
    try {
      S.datos = guardados;
      if (S.jSel == null || !S.datos.jornadas.find(j => j.numero === S.jSel)) S.jSel = jornadaActual();
      pintarCabecera();
      render();
    } catch (e) { S.datos = null; }
  }
  try {
    if (S.datos) {
      cargarDatos().then(() => { if (!$('#capa-modal').innerHTML && !(S.vista === 'admin' && S.edJornada)) render(); })
        .catch(() => toast('Sin conexión: se muestran los últimos datos guardados', true));
    } else {
      await cargarDatos();
      render();
    }
  } catch (e) {
    $('#app').innerHTML = '<div class="card"><h2>No se pudo cargar</h2><div class="error">' + esc(e.message) + '</div><div class="acciones"><button class="btn btn-verde" onclick="location.reload()">Reintentar</button></div></div>';
    return;
  }
  // Recupera los pronósticos propios si había sesión guardada
  if (S.sesion) {
    api('entrarJugador', { jugadorId: S.sesion.id, pin: S.sesion.pin })
      .then(r => { S.propios = r.pronosticos || {}; if (S.vista === 'jornada') render(); })
      .catch(() => { S.sesion = null; almacen.del('lupinos_sesion'); almacen.del('lupinos_sesion', true); pintarCabecera(); });
  }
  // App instalable: service worker mínimo (solo para poder instalarla; no guarda nada en caché)
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  // Banner de resultados en directo (cada minuto mientras la web está a la vista)
  actualizarDirecto();
  setInterval(actualizarDirecto, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) actualizarDirecto(); });
  // Aviso de versión nueva de la web (al abrirla, cada 10 minutos y al volver a la pestaña)
  setTimeout(comprobarVersion, 8000);
  setInterval(comprobarVersion, 600000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) comprobarVersion(); });
  // Cuenta atrás y refresco periódico
  setInterval(() => document.querySelectorAll('[data-cuenta]').forEach(el => { el.textContent = cuentaAtras(el.dataset.cuenta); }), 30000);
  setInterval(() => {
    if (document.hidden || $('#capa-modal').innerHTML || S.vista === 'admin') return;
    cargarDatos().then(render).catch(() => {});
  }, 120000);
})();
